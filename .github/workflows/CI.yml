name: CI
on:
  push:
    branches:
      - main
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'  # Minimum supported version (LTS)
          - '1'    # Latest release
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # official XSDs for the schema validation tests (xmllint is not available on Windows)
      - uses: actions/checkout@v7
        if: runner.os != 'Windows'
        with:
          repository: IAU-ADES/ADES-Master
          ref: f4158f96a049b83dfcf848fa33eaac4391db9460
          path: ADES-Master
          sparse-checkout: xsd
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - uses: julia-actions/julia-runtest@v1
        env:
          ADES_MASTER: ${{ runner.os != 'Windows' && format('{0}/ADES-Master', github.workspace) || '' }}
